<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LinkVault lightning bolt">
  <defs>
    <linearGradient id="bolt" x1="18" y1="8" x2="45" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff36b"/>
      <stop offset="0.52" stop-color="#ffd735"/>
      <stop offset="1" stop-color="#ffad16"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-25%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#ffd735" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path
    d="M36.5 4 12 35.5h17L25.5 60 52 27.5H34.5L36.5 4Z"
    fill="url(#bolt)"
    stroke="#a96300"
    stroke-width="2"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
